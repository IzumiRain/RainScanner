name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: go test -race -count=1 -timeout=120s ./...
      - name: Build supported platforms
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/rainscan-linux ./cmd/cdnscan
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/rainscan-windows.exe ./cmd/cdnscan
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser test dependencies
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          install_browser() {
            if [ "$PLAYWRIGHT_CACHE_HIT" = "true" ]; then
              ./node_modules/.bin/playwright-core install chromium
            else
              ./node_modules/.bin/playwright-core install --with-deps chromium
            fi
          }
          attempt=1
          until install_browser; do
            if [ "$attempt" -ge 3 ]; then
              echo "Playwright browser install failed after $attempt attempts" >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "Browser install failed; retrying in 30s (attempt $attempt of 3)..."
            sleep 30
          done
      - run: npm run test:browser
