name: release

# Build release binaries on GitHub's runners (clean cross-compiles — no local
# Windows Defender false-positive quarantine) and attach them to a GitHub Release.
# Triggered by pushing a version tag, e.g.  git tag v1.0.0 && git push origin v1.0.0

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write          # required to create the Release

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            asset: rainscan-windows-amd64.exe
            xray_asset: Xray-windows-64.zip          # xray-core release asset for this target
            embed_dest: internal/xray/assets/xray-windows-amd64.zip
          - goos: linux
            goarch: amd64
            asset: rainscan-linux-amd64
            xray_asset: Xray-linux-64.zip
            embed_dest: internal/xray/assets/xray-linux-amd64.zip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod   # tracks the toolchain pinned in go.mod (go 1.26)

      # Bake the matching xray-core into the binary: overwrite the committed
      # placeholder zip with the real release asset before compiling, so embed picks
      # it up. (A plain `go build` without this step embeds the empty placeholder.)
      - name: fetch xray-core for embedding
        env:
          XRAY_ASSET: ${{ matrix.xray_asset }}
          EMBED_DEST: ${{ matrix.embed_dest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Verify the asset against the digest GitHub recorded at upload time
          # before it is baked into every shipped binary.
          digest=$(gh api repos/XTLS/Xray-core/releases/latest --jq ".assets[] | select(.name==\"$XRAY_ASSET\") | .digest")
          gh release download --repo XTLS/Xray-core --pattern "$XRAY_ASSET" --output "$EMBED_DEST" --clobber
          got=$(sha256sum "$EMBED_DEST" | awk '{print $1}')
          want=${digest#sha256:}
          if [ -z "$want" ] || [ "$got" != "$want" ]; then
            echo "xray asset checksum mismatch for $XRAY_ASSET: want $want got $got" >&2
            exit 1
          fi
          ls -l "$EMBED_DEST"

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0            # pure-stdlib, static binary
        run: go build -trimpath -ldflags "-s -w" -o "${{ matrix.asset }}" ./cmd/cdnscan

      - name: upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: generate SHA256 checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/rainscan-windows-amd64.exe
            dist/rainscan-linux-amd64
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
